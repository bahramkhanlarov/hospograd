<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Create your HospoGrad account as a current student or alumni." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2430'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23c9975a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
    <title>Sign up · HospoGrad</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="nav" id="site-nav"></nav>
    <div class="form-card">
      <h2>Create your account</h2>
      <form id="signup-form">
        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" />
        </div>
        <div class="form-field">
          <label for="school">School</label>
          <input type="text" id="school" required placeholder="e.g. EHL" />
        </div>
        <div class="form-field">
          <label for="status">I am a...</label>
          <select id="status">
            <option value="student">Current student</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
        <p class="error-message" id="error" hidden></p>
        <button type="submit" class="btn">Sign up</button>
      </form>
      <p>Already have an account? <a href="/login.html">Log in</a></p>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/signup.js"></script>
  </body>
</html>
