<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Enter the verification code sent to your email." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2430'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23c9975a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
    <title>Verify your email · HospoGrad</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="nav" id="site-nav"></nav>
    <div class="form-card">
      <h2>Check your email</h2>
      <p>Enter the 6-digit code we sent you.</p>
      <form id="verify-form">
        <div class="form-field">
          <label for="code">Verification code</label>
          <input type="text" id="code" required maxlength="6" pattern="[0-9]{6}" />
        </div>
        <p class="error-message" id="error" hidden></p>
        <button type="submit" class="btn">Verify</button>
      </form>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/verify-otp.js"></script>
  </body>
</html>
