<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Submit proof of alumni status for HospoGrad verification." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2430'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23c9975a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
    <title>Verify your alumni status · HospoGrad</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="nav" id="site-nav"></nav>
    <div class="form-card">
      <h2>Verify your alumni status</h2>
      <p>Submit a LinkedIn profile URL or upload proof (diploma photo, alumni card).</p>
      <form id="alumni-form">
        <div class="form-field">
          <label for="linkedinUrl">LinkedIn URL (optional if uploading a document)</label>
          <input type="url" id="linkedinUrl" />
        </div>
        <div class="form-field">
          <label for="document">Document (optional if providing a LinkedIn URL)</label>
          <input type="file" id="document" />
        </div>
        <p class="error-message" id="error" hidden></p>
        <button type="submit" class="btn">Submit for review</button>
      </form>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/alumni-verify.js"></script>
  </body>
</html>
