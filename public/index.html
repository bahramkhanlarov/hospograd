<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HospoGrad is a community for Swiss hotel management students and alumni to discuss housing, insurance, visas, jobs, and school life." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2430'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23c9975a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
    <title>HospoGrad</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="nav" id="site-nav"></nav>
    <div class="header-strip-breadcrumb" id="breadcrumb-strip"></div>
    <div class="school-banner">
      <span class="school-banner-label">Our community includes students &amp; alumni from:</span>
      <div class="school-banner-logos">
        <img src="/images/schools/glion.jpg" alt="Glion Institute of Higher Education" width="454" height="135" />
        <img src="/images/schools/ehl.png" alt="EHL Hospitality Business School" width="967" height="851" />
        <img src="/images/schools/les-roches.png" alt="Les Roches" width="800" height="800" />
        <img src="/images/schools/shms.png" alt="Swiss Hotel Management School" width="128" height="114" />
        <img src="/images/schools/shl.svg" alt="SHL Schweizerische Hotelfachschule Luzern" width="228" height="110" />
        <img src="/images/schools/htmi.png" alt="HTMi Hotel and Tourism Management Institute" width="72" height="104" />
        <img src="/images/schools/caas.png" alt="Culinary Arts Academy Switzerland" width="145" height="145" />
        <img src="/images/schools/ihtti.jpg" alt="IHTTI School of Hotel and Design Management" width="200" height="200" />
        <img src="/images/schools/isbm.png" alt="ISBM Geneva" width="360" height="354" />
      </div>
      <p class="school-banner-disclaimer">HospoGrad is an independent, student-run community and is not affiliated with or endorsed by these institutions.</p>
    </div>
    <div class="layout">
      <main class="main" style="flex: 1 1 100%;">
        <p class="homepage-intro">Switzerland&rsquo;s community for hotel management students and alumni &mdash; housing, visas, jobs, and everything in between.</p>
        <div class="table-scroll"><table class="forum-index" id="forum-index"></table></div>
        <div>
          <a href="?sort=new" class="btn-secondary btn" id="sort-new">New</a>
          <a href="?sort=top" class="btn-secondary btn" id="sort-top">Top</a>
        </div>
        <div class="table-scroll"><table class="thread-table" id="post-list"></table></div>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/home.js"></script>
  </body>
