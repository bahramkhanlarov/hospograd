name = "hospograd-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "hospograd"
database_id = "c47174d7-0cec-4592-acc4-e468078d2bf0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "hospograd-uploads"

# No [vars] section: SESSION_SECRET and RESEND_API_KEY are secrets, not
# non-secret config. They must never be committed here.
# - Local dev / tests: provide them via the gitignored .dev.vars file
#   (wrangler dev and vitest-pool-workers both load it automatically).
# - Production: provide them via `wrangler secret put SESSION_SECRET` and
#   `wrangler secret put RESEND_API_KEY` (see plan's "Post-Plan Manual Steps").

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
