name = "hospograd-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "hospograd"
database_id = "REPLACE_WITH_REAL_D1_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "hospograd-uploads"

[vars]
# Local/test default only. Production overrides this via `wrangler secret put SESSION_SECRET`,
# which takes precedence over [vars] at deploy time.
SESSION_SECRET = "dev-only-session-secret-replace-in-production"
